<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <circle cx="256" cy="256" r="256" fill="url(#gradient)"/>
  
  <!-- White medical cross -->
  <rect x="216" y="96" width="80" height="320" rx="8" fill="white"/>
  <rect x="96" y="216" width="320" height="80" rx="8" fill="white"/>
  
  <!-- Inner blue cross for depth -->
  <rect x="232" y="112" width="48" height="288" rx="4" fill="#38bdf8"/>
  <rect x="112" y="232" width="288" height="48" rx="4" fill="#38bdf8"/>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
