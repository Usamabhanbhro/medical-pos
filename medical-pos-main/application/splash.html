<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=400, initial-scale=1.0">
  <title>Loading...</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      /* Use the same gentle gradient as the app (blue -> white -> green) */
      background: linear-gradient(to bottom right, #dbeafe 0%, #ffffff 50%, #ecfccb 100%);
      color: #0f172a; /* dark text to match light background */
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .spinner {
      width: 60px;
      height: 60px;
      /* lighter ring with a bright top color matching the app blue */
      border: 6px solid rgba(15, 23, 42, 0.08);
      border-top: 6px solid #3b82f6; /* blue-500 */
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(99,102,241,0.06);
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-text {
      font-size: 1.3rem;
      letter-spacing: 0.05em;
      color: #0f172a;
    }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <div class="loading-text">Loading, please wait...</div>
  </div>
</body>
</html>
